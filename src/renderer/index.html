<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — Organize sua rotina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="drag-area"></div>
   <div class="window-controls">
    <button class="window-btn close" id="btn-close" title="Fechar"></button>
    <button class="window-btn minimize" id="btn-minimize" title="Minimizar"></button>
    <button class="window-btn maximize" id="btn-maximize" title="Maximizar"></button>
  </div>
  <main class="login-container">
    <section class="brand">
      <div class="logo">✓</div>
      <h1>taskly<span>.</span></h1>
      <p>Menos distrações. Mais realizações.</p>

      <div class="quote">
        <span class="quote-mark">“</span>
        <h2>Organize suas ideias.<br>Conquiste seus objetivos.</h2>
        <p>Um passo de cada vez.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="form-wrapper">
        <span class="eyebrow">BEM-VINDO DE VOLTA</span>
        <h2>Entre na sua conta</h2>
        <p class="subtitle">Continue de onde você parou.</p>

        <form id="login-form">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="voce@exemplo.com"
            autocomplete="username"
            required
          >

          <label for="password">Senha</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-password">
              Mostrar
            </button>
          </div>

          <button type="submit" class="submit-button">
            Entrar na minha conta <span>→</span>
          </button>

          <p id="message" role="status"></p>
        </form>

        <p class="register">
          Ainda não tem uma conta?
          <a href="#" id="register-link">Criar conta</a>
        </p>
      </div>

      <footer>Feito para você focar no que importa.</footer>
    </section>
  </main>

  <script src="renderer.js"></script>
  <script src="storage.js"></script>
</body>
</html>
